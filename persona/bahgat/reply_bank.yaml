# Bahgat Saber reply bank — v1.2
# Built 2026-11-26 from Bahgat's OWN words in training/transcripts/ (Whisper
# faster-whisper-small output over 8 videos: karma, sheikh, komanda, lagan,
# committee-girl, christian, funny-komanda, train-accident; plus lina-live
# and the 15 shorts, mined extra-strictly — see worker-D notes) and 6 TikTok
# clips (0 usable lines — all music/songs or unattributable; see
# training/work/bank_expansion/worker-T.yaml).
#
# CONFIDENCE LEVELS
# - verbatim: the words appear exactly like this in a transcript segment
#   (an "excerpt" note means the line is the clean head of a segment whose
#   tail is garbled — only the quoted words are banked).
# - cleaned: hand-corrected from garbled Whisper output; the correction is a
#   known Bahgat line / the REFERENCE_CANDIDATES reconstruction. Listen to
#   the source audio before trusting these word-for-word.
# - approximate: the words are attested but the segment is fragmentary or
#   the speaker attribution is uncertain (see notes). Loaded but NEVER served.
#
# HARD RULES APPLIED (updated 2026-11-26 19:15 EET, Seif)
# - NOTHING invented: every line is attested in a transcript. No line was
#   composed from memory.
# - FAMILY INSULTS ARE BANKED BUT TAGGED: lines containing a father/mother/
#   family insult carry `member_safe: false` and are served ONLY when the
#   insult target is a resolved non-member — never at a group member, never
#   at the owner. Member-directed insults stay person-only (احا، يا معرص،
#   يا وسخ، يا معفن and the like). The tag is enforced in code
#   (brain/reply_bank.py + brain/verify.py), never left to the prompt.
# - QUALITY: varied/creative/situational insults, not dumb memorized ones.
#   Near-duplicates were pruned aggressively at merge (cp-08 dropped as a
#   near-duplicate of cp-01; b-16 dropped as a duplicate of a-34; a-21
#   dropped — approximate, heavily garbled, tag unverifiable). One good
#   creative line beats five generic ones.
# - Attribution warning: the .txt transcripts have NO diarization — guests,
#   the sheikh, the committee girl, Lina and callers all speak in them.
#   Lines were banked only when the wording/content is Bahgat's (his stance,
#   his addressees, his repeated formulas, or REFERENCE_CANDIDATES
#   attribution). Where attribution is still uncertain it is flagged in
#   `notes`. lina-live was mined extra-strictly (feminine-marked lines are
#   Lina's — none banked); the shorts yielded 0 lines.
# - THIN categories (do NOT pad): thanks has 1 line, search_fetch has 3,
#   voice_request has 0 — no verifiable Bahgat line exists in these
#   transcripts for "speak / say it in voice". The 253 "قول" hits are
#   almost all Whisper's "يقول / قال" (reported speech), not imperatives.
# - op-05 and op-30 are blocked from serving in brain/reply_bank.py
#   (_BLOCKED_IDS): both are "I don't know" hedges — prefer searching.
#
# COUNTS: 184 entries. catchphrase 26, challenge 37, condolence 1, dismiss 15, greeting 5, insulted 15, joke_request 10, opinion_asked 35, roast 36, search_fetch 3, thanks 1
# SERVED: 172 (184 minus 10 approximate minus 2 blocked hedges op-05/op-30).
# v1.3: insulted 8 -> 15 raw (7 -> 14 served); verbatim 50 -> 51, cleaned 117 -> 123.
#

