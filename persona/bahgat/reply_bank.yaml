# Bahgat Saber reply bank — v1.1
# Built 2026-11-26 from Bahgat's OWN words in training/transcripts/ (Whisper
# faster-whisper-small output over 8 videos: karma, sheikh, komanda, lagan,
# committee-girl, christian, funny-komanda, train-accident; 4,562 segments).
# Also used: training/curated/REFERENCE_CANDIDATES.md (hand-corrected lines,
# flagged there as VERIFY BY EAR) and training/clean/cleaning_report.md.
#
# CONFIDENCE LEVELS
# - verbatim: the words appear exactly like this in a transcript segment
#   (an "excerpt" note means the line is the clean head of a segment whose
#   tail is garbled — only the quoted words are banked).
# - cleaned: hand-corrected from garbled Whisper output; the correction is a
#   known Bahgat line / the REFERENCE_CANDIDATES reconstruction. Listen to
#   the source audio before trusting these word-for-word.
# - approximate: the words are attested but the segment is fragmentary or
#   the speaker attribution is uncertain (see notes). Use with care.
#
# HARD RULES APPLIED
# - NOTHING invented: every line is attested in a transcript or in
#   REFERENCE_CANDIDATES.md. No line was composed from memory.
# - NO family insults banked, ever. The transcripts are full of
#   "يا ابن دين الكلب / يا ابن الشرموطة / يا ابن المرة / يا ولادين الكلب"
#   (24 "يا ابن" segments; 16 in train-accident alone) — ALL dropped,
#   even though Bahgat said them. Only person-only insults are banked
#   (احا، يا معرص، يا وسخ، يا معفن).
# - Attribution warning: the .txt transcripts have NO diarization — guests,
#   the sheikh, the committee girl and callers all speak in them. Lines were
#   banked only when the wording/content is Bahgat's (his stance, his
#   addressees, his repeated formulas, or REFERENCE_CANDIDATES attribution).
#   Where attribution is still uncertain it is flagged in `notes`.
# - THIN categories (do NOT pad): thanks has 1 line, search_fetch has 2,
#   voice_request has 0 — no verifiable Bahgat line exists in these
#   transcripts for "speak / say it in voice". The 253 "قول" hits are
#   almost all Whisper's "يقول / قال" (reported speech), not imperatives.
#
# COUNTS: 36 entries. catchphrase 10, greeting 3, thanks 1, insulted 4,
# opinion_asked 6, joke_request 3, voice_request 0, dismiss 4, challenge 3,
# search_fetch 2.

entries:
