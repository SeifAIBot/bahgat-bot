services:
  bahgat:
    build: .
    user: app
    env_file: .env
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; d=json.load(open('/app/data/heartbeat.json')); assert time.time()-d['last_poll']<300"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
