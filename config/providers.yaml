# LLM fallback chain — edit entries / order here, no code change.
#
# bahgat/llm.py tries these top to bottom and uses the first provider that
# answers with usable text. A failure (network, timeout, rate limit, empty
# completion, content refusal) moves to the next entry; 401/403/404 means a
# dead key or a retired model, so that entry is dropped for the rest of the
# process run. Keys are read from env vars only, one key per provider.
#
# Do NOT add a second account / second project of the same provider to
# multiply its quota — that breaks the providers' terms.
#
# v2.2 (expert review 2026-11-28, report in
# research_notes/bahgat-instinct-adaptation-expert-review-20261128-0409/):
# - Cerebras is NOT a permanent free tier ($5 / 30 days, card required) —
#   removed. OpenRouter free is 20 RPM / 50 RPD — removed by owner call
#   (skip both). gemma-4-31b-it is NOT a Gemini API model — removed.
#   gemini-3-flash-preview is a legacy preview — replaced by the stable
#   gemini-3.5-flash-lite as the Gemini entry. Groq limits are per model
#   (30 RPM / 1,000 RPD / 8,000 TPM / 200,000 TPD), which is why Groq
#   has three entries. NVIDIA NIM trial terms say testing/evaluation
#   only — keep NIM as overflow, never the primary. Gemini per-model
#   free RPM/RPD is NOT published — AI Studio is authoritative; treat
#   Gemini as a spare, budget on Groq's published numbers.
providers:
  - name: groq-20b
    family: groq
    model: openai/gpt-oss-20b
    base_url: https://api.groq.com/openai/v1
    env_key: GROQ_API_KEY
    timeout_seconds: 15
    note: "primary — fastest of the three Groq models"
  - name: groq-120b
    family: groq
    model: openai/gpt-oss-120b
    base_url: https://api.groq.com/openai/v1
    env_key: GROQ_API_KEY
    timeout_seconds: 15
    note: "strongest Groq model; second so hard turns still land fast"
  - name: groq-qwen
    family: groq
    model: qwen/qwen3.8-27b
    base_url: https://api.groq.com/openai/v1
    env_key: GROQ_API_KEY
    timeout_seconds: 15
    note: "third Groq pool, strongest Arabic of the three (preview model)"
  - name: gemini-3.5-flash-lite
    family: gemini
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    env_key: GEMINI_API_KEY
    timeout_seconds: 15
    note: "Gemini entry — stable Lite model"
  - name: nvidia-nemotron
    family: nvidia
    model: nvidia/nemotron-3.5-super-vl-120b-a12b
    base_url: https://integrate.api.nvidia.com/v1
    env_key: NVIDIA_API_KEY
    timeout_seconds: 20
    note: "overflow only (NIM trial terms: testing/evaluation). Model verified live 2026-11-25; the older nemotron-3-super-120b-a12b is retired (410 Gone)."
